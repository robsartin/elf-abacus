[project]
name = "elf-abacus"
version = "0.1.0"
description = "Santa 2026 (Kaggle): shortest Elf Calculator arithmetic programs"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
elf_abacus = ["csrc/*.c"]

[tool.coverage.report]
# Line and branch combined; the CLI entry point (__main__) is exercised by real runs, not unit tests.
fail_under = 80
